<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toque de Ouro - Home </title>
    <link rel="stylesheet" href="style.css">

    <!---------------FONTE PRIMÁRIA---------------->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    
    <!---------------FONTE SECUNDÁRIA-------------->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>

<body>
    <header>
         <div class="container">
            <div class="logo">
                <img src="../Imagens/Logo.png" alt="Logo escrito Toque de Ouro">
            </div>
        </div>
    </header>

    <main>
        <section class="login_sessão">
            <div class="form_container">
                <h2>Login</h2>
                <form action="#">
                    <div class="form_email">
                        <input type="text" required>
                        <label>Email ou Número de telefone</label>
                    </div>
                    <div class="form_email">
                        <input type="password" required>
                        <label>Senha</label>
                    </div>
                        <button type="submit">LOGIN</button>
                </form>
            </div>
        </section>

    </main>

    <footer>
        <div class="footer_rodape">
        
                <div class="logo_footer_container">
                  <img class="logo_footer" src="../Imagens/Logo.png" alt="Logo escrito Toque de Ouro">
                </div>
                <p>©2026 Toque de Ouro. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>
</html>
